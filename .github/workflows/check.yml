name: check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read # checkout only

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The $/ form zizmor asks for fails actionlint 1.7.12; this step runs right after the checkout.
      - uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: rust
          github-token: ${{ secrets.MISE_GITHUB_TOKEN }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
