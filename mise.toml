include = [
  "git::https://github.com/bengous/stack-watch.git//toolchain/rust.toml?ref=toolchain-2026.11.09",
  "git::https://github.com/bengous/stack-watch.git//toolchain/quality.toml?ref=toolchain-2026.11.09",
]

[hooks]
# mise runs it after every `mise install`: install only into a clone without hooks, never in CI.
# --force: lefthook refuses to install when core.hooksPath is set, even to .git/hooks.
postinstall = '[ -n "${CI:-}" ] || test -f "$(git rev-parse --git-path hooks/pre-commit)" || lefthook install --force'
